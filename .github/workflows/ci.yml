name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python genai_core.py
      - run: python nox_core.py
      - run: python diary_core.py
      - run: python entry_core.py
      - run: python corpit_core.py
      - run: pytest -q
