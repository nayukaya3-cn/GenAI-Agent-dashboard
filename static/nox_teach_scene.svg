<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t d">
  <title id="t">X 教える：作業学習から検定・実習・就職へ</title>
  <desc id="d">作業台の上に収穫かご、選別トレイ、袋詰めした豆、はかり、手順書。その奥に、作業学習・技能検定・職場体験実習・就職の4段の階段と旗。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f1fc"/><stop offset="0.6" stop-color="#fbf6ee"/><stop offset="1" stop-color="#f1eadf"/></linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98f5a"/><stop offset="1" stop-color="#a8703f"/></linearGradient>
  </defs>
  <rect width="480" height="360" rx="18" fill="url(#bg)"/>

  <!-- 4段の階段（①作業学習 ②技能検定 ③実習 ④就職・定着） -->
  <g>
    <rect x="200" y="176" width="66" height="38" fill="#e9f1fc" stroke="#2a78d6" stroke-width="2"/>
    <rect x="266" y="142" width="66" height="72" fill="#d6e6f8" stroke="#2a78d6" stroke-width="2"/>
    <rect x="332" y="108" width="66" height="106" fill="#c3d9f3" stroke="#2a78d6" stroke-width="2"/>
    <rect x="398" y="74" width="62" height="140" fill="#fde9df" stroke="#eb6834" stroke-width="2"/>
    <g font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1c5cab">
      <text x="233" y="202">1</text><text x="299" y="168">2</text><text x="365" y="134">3</text>
    </g>
    <text x="429" y="100" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#c4501f">4</text>
    <!-- 旗 -->
    <line x1="440" y1="74" x2="440" y2="30" stroke="#6b7a90" stroke-width="3"/>
    <path d="M440 30 L466 38 L440 46 Z" fill="#eb6834"/>
    <!-- 階段をのぼる足あと -->
    <g fill="#2a78d6" opacity="0.5">
      <ellipse cx="222" cy="170" rx="5" ry="3"/><ellipse cx="286" cy="136" rx="5" ry="3"/><ellipse cx="352" cy="102" rx="5" ry="3"/><ellipse cx="414" cy="68" rx="5" ry="3"/>
    </g>
  </g>

  <!-- 手順書（クリップボード）と星のめあて -->
  <g transform="translate(26 32)">
    <rect width="104" height="132" rx="8" fill="#ffffff" stroke="#6b7a90" stroke-width="2"/>
    <rect x="34" y="-8" width="36" height="16" rx="4" fill="#9aa5b4"/>
    <g stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M14 30 l5 5 l9 -10" stroke="#2a78d6"/><path d="M14 56 l5 5 l9 -10" stroke="#2a78d6"/><path d="M14 82 l5 5 l9 -10" stroke="#2a78d6"/>
      <rect x="14" y="102" width="14" height="14" rx="2" stroke="#9aa5b4" stroke-width="2"/>
    </g>
    <g stroke="#c9ced8" stroke-width="3" stroke-linecap="round"><path d="M38 30 h52 M38 56 h44 M38 82 h50 M38 110 h40"/></g>
    <path d="M90 104 l3 7 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 z" fill="#eb6834"/>
  </g>

  <!-- 作業台 -->
  <rect x="0" y="236" width="480" height="124" rx="0" fill="url(#table)"/>
  <rect x="0" y="232" width="480" height="10" fill="#d9a06a"/>
  <path d="M0 342 a18 18 0 0 0 18 18 H0 Z M480 342 a18 18 0 0 1 -18 18 H480 Z" fill="#f1eadf"/>

  <!-- ①収穫かご（枝豆） -->
  <g transform="translate(30 250)">
    <path d="M0 10 h96 l-10 56 h-76 z" fill="#e2b886" stroke="#a8703f" stroke-width="2"/>
    <g stroke="#a8703f" stroke-width="1.5" opacity="0.6"><path d="M4 26 h88 M6 42 h84 M8 56 h80"/></g>
    <g fill="#7fb06e" stroke="#5f9651" stroke-width="1">
      <path d="M8 10 q14 -18 30 -6 q-14 10 -30 6 Z"/><path d="M30 8 q16 -16 30 -2 q-14 8 -30 2 Z"/><path d="M56 10 q14 -16 30 -4 q-14 10 -30 4 Z"/>
    </g>
  </g>
  <!-- ②選別トレイ -->
  <g transform="translate(144 268)">
    <rect width="88" height="40" rx="6" fill="#ffffff" stroke="#9aa5b4" stroke-width="2"/>
    <line x1="44" y1="4" x2="44" y2="36" stroke="#9aa5b4" stroke-width="2"/>
    <g fill="#e8d7a8" stroke="#c9a25a"><circle cx="14" cy="16" r="5"/><circle cx="26" cy="22" r="5"/><circle cx="16" cy="28" r="5"/><circle cx="30" cy="12" r="5"/></g>
    <g fill="#a3876a"><circle cx="60" cy="20" r="4"/><circle cx="72" cy="26" r="3.5"/></g>
  </g>
  <!-- ③はかり -->
  <g transform="translate(252 262)">
    <rect x="0" y="22" width="76" height="34" rx="6" fill="#f3f5f8" stroke="#6b7a90" stroke-width="2"/>
    <rect x="12" y="32" width="52" height="16" rx="3" fill="#14171d"/>
    <g font-family="monospace" font-size="12" fill="#7fe08a"><text x="17" y="44">500g</text></g>
    <rect x="8" y="14" width="60" height="8" rx="3" fill="#c9ced8"/>
    <!-- 袋詰めした豆 -->
    <path d="M20 14 l4 -26 h28 l4 26 z" fill="#fde9df" stroke="#eb6834" stroke-width="2"/>
    <g fill="#e8d7a8"><circle cx="32" cy="2" r="3"/><circle cx="42" cy="4" r="3"/><circle cx="37" cy="-6" r="3"/></g>
  </g>
  <!-- ④できあがった袋の列 -->
  <g transform="translate(350 266)">
    <path d="M0 40 l3 -34 h22 l3 34 z" fill="#fde9df" stroke="#eb6834" stroke-width="2"/>
    <path d="M34 40 l3 -34 h22 l3 34 z" fill="#fde9df" stroke="#eb6834" stroke-width="2"/>
    <path d="M68 40 l3 -34 h22 l3 34 z" fill="#fde9df" stroke="#eb6834" stroke-width="2"/>
    <g stroke="#2a78d6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 24 l4 4 l7 -8"/><path d="M42 24 l4 4 l7 -8"/><path d="M76 24 l4 4 l7 -8"/>
    </g>
  </g>
  <!-- 工程の流れ矢印 -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M128 330 h18 l-5 -5 M146 330 l-5 5"/><path d="M234 330 h18 l-5 -5 M252 330 l-5 5"/><path d="M332 330 h16 l-5 -5 M348 330 l-5 5"/>
  </g>
</svg>
