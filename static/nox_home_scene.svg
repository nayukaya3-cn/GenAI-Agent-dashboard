<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t d">
  <title id="t">農＋X：暮らしの風景</title>
  <desc id="d">窓の外に麦畑と大豆の畑が広がる朝の食卓。自家製小麦のパン、豆のスープ、枝豆、麦の穂を挿した瓶が並ぶ。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2f8"/><stop offset="1" stop-color="#fdf1e6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ee"/><stop offset="1" stop-color="#f3eadc"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98f5a"/><stop offset="1" stop-color="#a8703f"/>
    </linearGradient>
    <radialGradient id="loaf" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e9a65a"/><stop offset="0.7" stop-color="#c97a34"/><stop offset="1" stop-color="#9c5a22"/>
    </radialGradient>
    <radialGradient id="soup" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f6d9a0"/><stop offset="1" stop-color="#dcb06a"/>
    </radialGradient>
    <clipPath id="win"><rect x="70" y="34" width="340" height="168" rx="10"/></clipPath>
  </defs>

  <!-- 壁 -->
  <rect width="480" height="360" rx="18" fill="url(#wall)"/>

  <!-- 窓の外：朝の空・山・麦畑・大豆畑 -->
  <g clip-path="url(#win)">
    <rect x="70" y="34" width="340" height="168" fill="url(#sky)"/>
    <circle cx="335" cy="78" r="22" fill="#fbd38d"/>
    <circle cx="335" cy="78" r="34" fill="#fbd38d" opacity="0.25"/>
    <path d="M70 128 Q140 92 210 118 T340 104 T410 116 V202 H70 Z" fill="#a9c7a0"/>
    <path d="M70 146 Q160 124 250 142 T410 136 V202 H70 Z" fill="#e8c46a"/>
    <!-- 麦の穂の列 -->
    <g stroke="#c99a3a" stroke-width="2" stroke-linecap="round">
      <path d="M86 202 V160 M104 202 V156 M122 202 V158 M140 202 V154 M158 202 V157 M176 202 V153 M194 202 V156 M212 202 V152 M230 202 V155"/>
    </g>
    <g fill="#d9a744">
      <ellipse cx="86" cy="157" rx="3" ry="7"/><ellipse cx="104" cy="153" rx="3" ry="7"/><ellipse cx="122" cy="155" rx="3" ry="7"/>
      <ellipse cx="140" cy="151" rx="3" ry="7"/><ellipse cx="158" cy="154" rx="3" ry="7"/><ellipse cx="176" cy="150" rx="3" ry="7"/>
      <ellipse cx="194" cy="153" rx="3" ry="7"/><ellipse cx="212" cy="149" rx="3" ry="7"/><ellipse cx="230" cy="152" rx="3" ry="7"/>
    </g>
    <!-- 輪作のとなり：大豆の畝 -->
    <path d="M250 202 Q300 150 410 150 V202 Z" fill="#7fb06e"/>
    <g fill="#5f9651">
      <circle cx="290" cy="186" r="6"/><circle cx="314" cy="178" r="6"/><circle cx="338" cy="172" r="6"/><circle cx="362" cy="168" r="6"/><circle cx="388" cy="165" r="6"/>
      <circle cx="304" cy="196" r="6"/><circle cx="330" cy="190" r="6"/><circle cx="356" cy="185" r="6"/><circle cx="382" cy="181" r="6"/>
    </g>
    <!-- 遠くのハウス -->
    <path d="M150 122 q22 -18 44 0 v10 h-44 z" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.5"/>
    <!-- 小鳥 -->
    <path d="M118 66 q6 -6 12 0 q6 -6 12 0" fill="none" stroke="#6b7a90" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- 窓枠 -->
  <rect x="70" y="34" width="340" height="168" rx="10" fill="none" stroke="#ffffff" stroke-width="8"/>
  <line x1="240" y1="34" x2="240" y2="202" stroke="#ffffff" stroke-width="6"/>
  <rect x="62" y="200" width="356" height="10" rx="4" fill="#e6d8c4"/>

  <!-- テーブル -->
  <path d="M0 238 H480 V342 a18 18 0 0 1 -18 18 H18 a18 18 0 0 1 -18 -18 Z" fill="url(#table)"/>
  <rect x="0" y="234" width="480" height="10" fill="#d9a06a"/>
  <!-- 布（ランチョンマット） -->
  <path d="M120 256 H372 L386 336 H106 Z" fill="#fde9df" stroke="#eb6834" stroke-width="1.5" opacity="0.95"/>
  <g stroke="#eb6834" stroke-width="1" opacity="0.35">
    <path d="M140 256 L128 336 M180 256 L174 336 M220 256 L218 336 M260 256 L262 336 M300 256 L306 336 M340 256 L350 336"/>
  </g>

  <!-- 麦の穂を挿した瓶 -->
  <g>
    <path d="M412 196 q-10 -40 -4 -78 M420 196 q2 -42 12 -74 M416 196 q-2 -46 -18 -70" fill="none" stroke="#b58a3a" stroke-width="2"/>
    <g fill="#d9a744">
      <ellipse cx="408" cy="112" rx="4" ry="11"/><ellipse cx="433" cy="116" rx="4" ry="11" transform="rotate(18 433 116)"/><ellipse cx="397" cy="122" rx="4" ry="11" transform="rotate(-28 397 122)"/>
    </g>
    <path d="M402 196 h28 l-3 50 a6 6 0 0 1 -6 6 h-10 a6 6 0 0 1 -6 -6 Z" fill="#dbeaf7" stroke="#2a78d6" stroke-width="1.5" opacity="0.9"/>
  </g>

  <!-- 自家製小麦のパン（まな板の上） -->
  <ellipse cx="190" cy="300" rx="78" ry="20" fill="#000" opacity="0.12"/>
  <rect x="112" y="282" width="156" height="20" rx="10" fill="#e2b886" stroke="#b9854f" stroke-width="1.5"/>
  <ellipse cx="190" cy="266" rx="62" ry="34" fill="url(#loaf)"/>
  <g fill="none" stroke="#f6d3a0" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M150 256 q12 -10 26 -4"/><path d="M176 248 q14 -10 28 -2"/><path d="M204 252 q12 -8 24 2"/>
  </g>
  <!-- 切ったひと切れ -->
  <path d="M238 284 q8 -30 30 -28 q10 2 8 28 Z" fill="#f7e3c0" stroke="#c97a34" stroke-width="3"/>

  <!-- 豆のスープ -->
  <ellipse cx="318" cy="314" rx="50" ry="10" fill="#000" opacity="0.12"/>
  <path d="M270 284 h96 a48 30 0 0 1 -96 0 Z" fill="#ffffff" stroke="#9aa5b4" stroke-width="1.5"/>
  <ellipse cx="318" cy="284" rx="48" ry="11" fill="url(#soup)" stroke="#ffffff" stroke-width="3"/>
  <g fill="#c9a25a"><circle cx="300" cy="283" r="3"/><circle cx="312" cy="287" r="3"/><circle cx="326" cy="281" r="3"/><circle cx="338" cy="286" r="3"/><circle cx="318" cy="279" r="3"/></g>
  <g fill="#6aa35a"><circle cx="306" cy="279" r="2"/><circle cx="332" cy="284" r="2"/></g>
  <path d="M374 290 l34 -14" stroke="#9aa5b4" stroke-width="4" stroke-linecap="round"/>
  <!-- 湯気 -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M304 268 q-8 -12 0 -22 q8 -10 0 -22"/><path d="M322 266 q-8 -12 0 -22 q8 -10 0 -22"/><path d="M340 268 q-8 -12 0 -22"/>
  </g>

  <!-- 枝豆の小鉢 -->
  <path d="M60 300 h56 a28 18 0 0 1 -56 0 Z" fill="#e9f1fc" stroke="#2a78d6" stroke-width="1.5"/>
  <g fill="#7fb06e" stroke="#5f9651" stroke-width="1">
    <path d="M66 298 q14 -16 30 -6 q-14 10 -30 6 Z"/><path d="M84 296 q16 -14 28 -2 q-14 8 -28 2 Z"/><path d="M74 290 q12 -14 26 -8 q-12 10 -26 8 Z"/>
  </g>

  <!-- 輪作のしるし（小さな🔁の円） -->
  <g transform="translate(40 52)">
    <circle r="22" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
    <path d="M-11 -4 a12 12 0 0 1 21 -5" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12 -15 l-1 7 l-7 -2" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M11 4 a12 12 0 0 1 -21 5" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-12 15 l1 -7 l7 2" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
